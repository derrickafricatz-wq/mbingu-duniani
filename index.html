#startupDeka::after{

<script>

/* =========================
   OFFLINE VIDEO DATABASE
========================= */

const DB_NAME = "afya-media-db-v33";
const STORE_NAME = "media-files";

let db;

/* OPEN DATABASE */
function openDatabase(){

  return new Promise((resolve,reject)=>{

    const request = indexedDB.open(DB_NAME,1);

    request.onupgradeneeded = (e)=>{

      db = e.target.result;

      if(!db.objectStoreNames.contains(STORE_NAME)){

        db.createObjectStore(STORE_NAME);

      }

    };

    request.onsuccess = (e)=>{

      db = e.target.result;

      resolve();

    };

    request.onerror = ()=>{

      reject();

    };

  });

}

/* SAVE VIDEO */
async function saveMedia(id,url){

  const response = await fetch(url);

  const blob = await response.blob();

  const tx = db.transaction(STORE_NAME,"readwrite");

  tx.objectStore(STORE_NAME).put(blob,id);

}

/* GET VIDEO */
function getMedia(id){

  return new Promise((resolve)=>{

    const tx = db.transaction(STORE_NAME,"readonly");

    const req = tx.objectStore(STORE_NAME).get(id);

    req.onsuccess = ()=>{

      resolve(req.result);

    };

  });

}

  </script>

function goFullScreen(){
  const el=document.documentElement;
  if(el.requestFullscreen) el.requestFullscreen();
  else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else if(el.msRequestFullscreen) el.msRequestFullscreen();
}
document.body.addEventListener("click", goFullScreen, {once:true});

const guideSteps = [

  { text: "PLATFORM. GUIDE." },

  { text: "Swipe UP to show the smart menu." },

  { text: "Swipe DOWN to hide menus and panels." },

let guideIndex = 0;
const guideOverlay = document.getElementById("guideOverlay");

nextGuide.onclick = () => {
  guideIndex++;
  if(guideIndex >= guideSteps.length){

  } else {

};

const settingsBtn = document.getElementById("settingsBtn");

settingsBtn.onclick = () => {

/* PLAY VIDEO */
async function playVideo(i){

  if(i >= playlist.length) i = 0;

  if(i < 0) i = playlist.length - 1;

  index = i;

  const path = playlist[index];

  /* GET FILE NAME */
  const id = path
    .split("/")
    .pop()
    .replace(".mp4","");

  /* CHECK DATABASE */
  const blob = await getMedia(id);

  /* PLAY OFFLINE VERSION */
  if(blob){

    const localURL = URL.createObjectURL(blob);

    video.src = localURL;

    console.log("Playing offline:",id);

  }

  /* FALLBACK TO ONLINE */
  else{

    video.src = path;

    console.log("Streaming online:",id);

  }

  video.play().catch(()=>{});

}

      behavior: "smooth"
    });
  }
});

let recognition = null;
let isListening = false;
let lastTranscript = "";

function removeOverlap(oldText, newText) {
  const oldWords = oldText.trim().split(/\s+/);
  const newWords = newText.trim().split(/\s+/);

  const max = Math.min(oldWords.length, newWords.length, 10);

  for (let n = max; n > 0; n--) {
    const oldPart = oldWords.slice(-n).join(" ").toLowerCase();
    const newPart = newWords.slice(0, n).join(" ").toLowerCase();

    if (oldPart === newPart) {
      return newWords.slice(n).join(" ");
    }
  }

  return newText.trim();
}
  
let mediaRecorder = null;
let audioChunks = [];

  const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();

  recognition.lang = "sw-TZ";

  recognition.continuous = true;

  recognition.interimResults = false;

  recognition.onresult = (event) => {
  let interimText = "";

  for (let i = event.resultIndex; i < event.results.length; i++) {
    const text = event.results[i][0].transcript;

    if (event.results[i].isFinal) {
      const cleanText = removeOverlap(currentTranscript, text);

      if (cleanText) {
        currentTranscript += cleanText + " ";
      }
    } else {
      interimText += text;
    }
  }

  transcriptText.textContent = currentTranscript + interimText;
};

  recognition.onend = () => {
  if (isListening) {
    setTimeout(() => {
      if (isListening) {
        recognition.start();
      }
    }, 200);
  }
};
}

    if (

      !toolsPanel.contains(range.commonAncestorContainer)
    ) {
      savedRange = range.cloneRange();
    }

  });

  const restoreSelection = () => {

    if (!savedRange) return;

    const currentSelection = window.getSelection();

    currentSelection.removeAllRanges();
    currentSelection.addRange(savedRange);

      restoreSelection();

      document.execCommand(
        button.dataset.command,

    restoreSelection();

    document.execCommand(
      "fontName",
      false,
      event.target.value
    );

  };

  toolsPanel.querySelector("#sizeTool").onchange = (event) => {

    restoreSelection();

    const px = event.target.value;
    if (!px) return;

    document.execCommand("fontSize", false, "7");

    bookScreen.querySelectorAll('font[size="7"]').forEach(el => {
      el.style.fontSize = px + "px";
      el.removeAttribute("size");
    });

    // Also handle browsers that wrap the selection in a span instead of <font>.
    const selection = window.getSelection();
    if (selection.rangeCount) {
      const range = selection.getRangeAt(0);
      let node = range.commonAncestorContainer;
      if (node.nodeType === 3) node = node.parentElement;
      if (node && node.closest && node.closest(".chapter-body, #bookContents, #bookTitle")) {
        const span = document.createElement("span");
        span.style.fontSize = px + "px";
        try {
          const fragment = range.extractContents();
          span.appendChild(fragment);
          range.insertNode(span);
        } catch(e) {}
      }
    }

  };

  toolsPanel.querySelector("#styleTool").onchange = (event) => {

    restoreSelection();

    const style = event.target.value;
    if (!style) return;

    const selection = window.getSelection();
    if (!selection.rangeCount || selection.isCollapsed) return;

    const range = selection.getRangeAt(0);

    if (["normal","h1","h2","h3","h4","blockquote","pre"].includes(style)) {
      const command = style === "normal" ? "p" : style;
      document.execCommand("formatBlock", false, command);
      return;
    }

    const className = "book-style-" + style;
    const span = document.createElement("span");
    span.className = className;

    try {
      const fragment = range.extractContents();
      span.appendChild(fragment);
      range.insertNode(span);
      selection.removeAllRanges();
      const newRange = document.createRange();
      newRange.selectNodeContents(span);
      selection.addRange(newRange);
    } catch (e) {
      console.warn("Could not apply text style", e);
    }

  };

  toolsPanel.querySelector("#colorTool").onchange = (event) => {

    restoreSelection();

    document.execCommand(
      "foreColor",
      false,
      event.target.value
    );

  };

  toolsPanel.querySelector("#highlightTool").onchange = (event) => {

    restoreSelection();

    document.execCommand(
      "hiliteColor",
      false,
      event.target.value
    );

  };

  bookScreen.appendChild(toolsPanel);
};

document.getElementById("startTranscript").onclick = async () => {
  if (isListening) return;

  isListening = true;

  const stream = await navigator.mediaDevices.getUserMedia({
    audio: true
  });

  mediaRecorder = new MediaRecorder(stream);
  audioChunks = [];

  mediaRecorder.ondataavailable = (event) => {
    if (event.data.size > 0) {
      audioChunks.push(event.data);
    }
  };

  mediaRecorder.start();

  recognition.start();
};

document.getElementById("stopTranscript").onclick = () => {
  isListening = false;

  if (recognition) {
    recognition.stop();
  }

  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    mediaRecorder.stop();
  }

  if (mediaRecorder && mediaRecorder.stream) {
  mediaRecorder.stream.getTracks().forEach(track => track.stop());
  }
};

   Refresh the main playlist ONCE when the app is opened.
   After that, automatic refresh is completely disabled.
   The user can still press REFRESH manually at any time.
========================= */
let initialAutoRefreshDone = false;

function initialAutoRefresh(){
  if (initialAutoRefreshDone) return;
  initialAutoRefreshDone = true;

  const splash = document.getElementById("startupDeka");

  // Refresh the playlist immediately, but keep the video stopped behind the startup screen.
  refreshLessons(false);

  // "powered by deka" stays on screen for 15 seconds on each fresh opening.
  setTimeout(() => {
    playVideo(0);
    startAds();

    if (splash) {
      splash.style.opacity = "0";
      setTimeout(() => splash.remove(), 850);
    }
  }, 15000);
}

function toggleTopics(toggleBtn){
  const buttons = _topics.querySelectorAll("#topicsList button");

  if(topicsExpanded){
    buttons.forEach((btn, i)=>{
      btn.style.display = i < 3 ? "block" : "none";
    });
    toggleBtn.innerText = "SHOW";
    topicsExpanded = false;
  } else {
    buttons.forEach(btn=>{
      btn.style.display = "block";
    });
    toggleBtn.innerText = "HIDE";
    topicsExpanded = true;
  }
}

function openTopic(key){
  const topic=healthyTopics[key];

  _lesson.style.display="flex";
  _topics.style.display="none";
  _inner.innerHTML="";

  topic.lines.forEach(line=>{
    const div=document.createElement("div");
    div.style.padding="15px 0";
    div.style.fontSize="24px";
    div.style.lineHeight="2";
    div.style.cursor = "pointer";  // indicate it can be selected

    if(typeof line==="string") div.innerText=line;

    if(typeof line==="object" && line.type==="image"){
      const img=document.createElement("img");
      img.src=line.src;
      div.appendChild(img);
    }

    // MARKING ON CLICK
    div.onclick = () => {
    div.classList.toggle("marked");
    div.style.background = div.classList.contains("marked") ? "#00ffff33" : "transparent";

};

    _inner.appendChild(div);
});

  _inner.style.top=_outer.clientHeight+"px";
  startScrolling();
}

function startScrolling(){
  if(scrollInterval) clearInterval(scrollInterval);

  scrollInterval=setInterval(()=>{
    let top=parseFloat(_inner.style.top);
    top-=scrollSpeed;

    if(top+_inner.offsetHeight<0) top=_outer.clientHeight;

    _inner.style.top=top+"px";
  },40);
}

function toggleScroll(){
  if(scrollInterval){
    clearInterval(scrollInterval);
    scrollInterval=null;
  } else startScrolling();
}

  if(dy<-60){
    smartToggle.style.opacity="1";

  }

  if(dy>60){
    smartPanel.classList.remove("show");
    smartToggle.classList.remove("active");
    smartToggle.style.opacity="0";
    smartToggle.style.transform="translateY(100px)";
    controls.classList.remove("show");
  }
});
