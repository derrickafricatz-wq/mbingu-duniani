/* ONE-TIME STARTUP BRAND — FULL SCREEN SMART STYLE */
#startupDeka{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  min-height:100vh;
  z-index:9999;
  display:flex;
  flex-direction:column;
  align-items:center;

  opacity:1;

}

#startupDeka::before{
  content:"";
  position:absolute;
  inset:0;
  background:#062b35;
}

#startupDeka::after{
  content:"";
  position:absolute;
  width:min(340px,70vw);
  height:2px;
  left:50%;

  transform:translateX(-50%);

  z-index:1;

  text-transform:lowercase;
  text-align:center;
  color:#ffffff;
  text-shadow:none;
  animation:dekaSmartIn 1s ease-out both;
}

.startup-line{
  display:none;
}

@keyframes dekaSmartIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}

  /* =========================
     SERMON TRANSCRIPT UI
     Clean + mobile friendly + 3D buttons
  ========================= */

  #transcriptPanel {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 180;
    display: none;
    overflow: hidden;
    box-sizing: border-box;
  }

  #transcriptTitle {
    position: relative;
    z-index: 2;
    color: #00ffff;
    font-family: 'Russo One', sans-serif;
    font-size: clamp(22px, 5vw, 30px);
    line-height: 1.2;
    padding: 22px 105px 14px 22px;
    margin: 0;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-sizing: border-box;
  }

  #closeTranscript {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 20;
    min-width: 112px;
    height: 52px;
    padding: 0 18px;
    border: 1px solid #00ffff;
    border-radius: 14px;
    background: linear-gradient(145deg, #252525, #0b0b0b);
    color: #fff;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: .5px;
    box-shadow:
      0 7px 0 #004d4d,
      0 12px 24px rgba(0,255,255,.18),
      inset 0 1px 0 rgba(255,255,255,.12);
    transition: transform .12s ease, box-shadow .12s ease;
  }

  #closeTranscript:active {
    transform: translateY(5px);
    box-shadow:
      0 2px 0 #004d4d,
      0 6px 12px rgba(0,255,255,.14),
      inset 0 1px 0 rgba(255,255,255,.08);
  }

  /* Transcript action buttons */
  #transcriptControls {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    width: 100%;
    padding: 8px 16px 14px;
    box-sizing: border-box;
  }

  #transcriptControls button {
    width: 100%;
    min-width: 0;
    min-height: 58px;
    padding: 12px 8px;
    border: 1px solid rgba(0,255,255,.85);
    border-radius: 15px;
    background: linear-gradient(145deg, #18ffff 0%, #00caca 55%, #008f8f 100%);
    color: #001010;
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(14px, 3.8vw, 17px);
    font-weight: 900;
    letter-spacing: .35px;
    white-space: nowrap;
    box-shadow:
      0 7px 0 #005858,
      0 11px 20px rgba(0,255,255,.16),
      inset 0 2px 0 rgba(255,255,255,.55),
      inset 0 -3px 0 rgba(0,0,0,.14);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    -webkit-tap-highlight-color: transparent;
  }

  #transcriptControls button:active {
    transform: translateY(5px) scale(.985);
    box-shadow:
      0 2px 0 #005858,
      0 5px 10px rgba(0,255,255,.12),
      inset 0 1px 0 rgba(255,255,255,.4);
    filter: brightness(.96);
  }

  #transcriptControls #savedSermons {
    position:relative;
    z-index:50;
    pointer-events:auto;
    grid-column: 1 / -1;
  }

  /* Give the primary actions a slightly stronger visual hierarchy */
  #transcriptControls #startTranscript,
  #transcriptControls #saveTranscript {
    position:relative;
    z-index:50;
    pointer-events:auto;
    background: linear-gradient(145deg, #38ffff 0%, #00dede 55%, #009999 100%);
  }

  #transcriptText {
    color: white !important;
    background: black !important;
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
    width: 100%;
    height: calc(100vh - 190px);
    padding: 18px 20px 100px;
    margin: 0;
    box-sizing: border-box;
    font-size: clamp(19px, 5vw, 22px);
    line-height: 1.8;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scroll-padding-bottom: 120px;
    outline: none;
  }

  @media (max-width: 420px) {
    #transcriptTitle {
      padding-left: 14px;
      padding-right: 118px;
      font-size: 21px;
    }

    #closeTranscript {
      right: 10px;
      top: 10px;
      min-width: 102px;
      height: 48px;
      font-size: 15px;
    }

    #transcriptControls {
      gap: 10px;
      padding: 6px 12px 12px;
    }

    #transcriptControls button {
      min-height: 54px;
      border-radius: 14px;
      font-size: 13px;
    }

    #transcriptText {
      height: calc(100vh - 175px);
      padding-left: 16px;
      padding-right: 16px;
      font-size: 19px;
    }
  }

  @media (min-width: 700px) {
    #transcriptControls {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      max-width: 900px;
      margin: 0 auto;
    }

    #transcriptControls #savedSermons {
    position:relative;
    z-index:50;
    pointer-events:auto;
      grid-column: auto;
    }
  }

/* =========================
   OFFLINE VIDEO DATABASE
========================= */

const DB_NAME = "afya-media-db-v33";
const STORE_NAME = "media-files";

let db;

/* OPEN DATABASE */
function openDatabase(){

  return new Promise((resolve,reject)=>{

    const request = indexedDB.open(DB_NAME,1);

    request.onupgradeneeded = (e)=>{

      db = e.target.result;

      if(!db.objectStoreNames.contains(STORE_NAME)){

        db.createObjectStore(STORE_NAME);

      }

    };

    request.onsuccess = (e)=>{

      db = e.target.result;

      resolve();

    };

    request.onerror = ()=>{

      reject();

    };

  });

}

/* SAVE VIDEO */
async function saveMedia(id,url){

  const response = await fetch(url);

  const blob = await response.blob();

  const tx = db.transaction(STORE_NAME,"readwrite");

  tx.objectStore(STORE_NAME).put(blob,id);

}

/* GET VIDEO */
function getMedia(id){

  return new Promise((resolve)=>{

    const tx = db.transaction(STORE_NAME,"readonly");

    const req = tx.objectStore(STORE_NAME).get(id);

    req.onsuccess = ()=>{

      resolve(req.result);

    };

  });

}

function removeOverlap(oldText, newText) {
  const oldWords = oldText.trim().split(/\s+/);
  const newWords = newText.trim().split(/\s+/);

  const max = Math.min(oldWords.length, newWords.length, 10);

  for (let n = max; n > 0; n--) {
    const oldPart = oldWords.slice(-n).join(" ").toLowerCase();
    const newPart = newWords.slice(0, n).join(" ").toLowerCase();

    if (oldPart === newPart) {
      return newWords.slice(n).join(" ");
    }
  }

  return newText.trim();
}

  let interimText = "";

  for (let i = event.resultIndex; i < event.results.length; i++) {
    const text = event.results[i][0].transcript;

    if (event.results[i].isFinal) {
      const cleanText = removeOverlap(currentTranscript, text);

      if (cleanText) {
        currentTranscript += cleanText + " ";
      }
    } else {
      interimText += text;
    }
  }

  transcriptText.textContent = currentTranscript + interimText;
};

  recognition.onend = () => {

// Keep a compact copy for the in-app Heaven's Books library.
async function compressBookCover(dataUrl){
  if(!dataUrl) return "";
  try{
    const img = new Image();
    img.src = dataUrl;
    await new Promise((resolve,reject)=>{ img.onload=resolve; img.onerror=reject; });
    const max = 700;
    const scale = Math.min(1, max / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round((img.naturalWidth || 1) * scale));
    c.height = Math.max(1, Math.round((img.naturalHeight || 1) * scale));
    const ctx = c.getContext("2d");
    ctx.drawImage(img,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",0.78);
  }catch(e){ return ""; }
}

document.getElementById("startTranscript").onclick = async () => {
  if (isListening) return;

  isListening = true;

  const stream = await navigator.mediaDevices.getUserMedia({
    audio: true
  });

  mediaRecorder = new MediaRecorder(stream);
  audioChunks = [];

  mediaRecorder.ondataavailable = (event) => {
    if (event.data.size > 0) {
      audioChunks.push(event.data);
    }
  };

  mediaRecorder.start();

  recognition.start();
};

document.getElementById("stopTranscript").onclick = () => {
  isListening = false;

  if (recognition) {
    recognition.stop();
  }

  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    mediaRecorder.stop();
  }

  if (mediaRecorder && mediaRecorder.stream) {
  mediaRecorder.stream.getTracks().forEach(track => track.stop());
  }
};

const HEAVENS_PAYMENT_LINK = "https://pay.blmtec.co.tz/pay/book-apos-s-payies-wggry8";
const HEAVENS_PAID_KEY = "heavensPaidBooks";

function getPaidBooks(){
  try{return JSON.parse(localStorage.getItem(HEAVENS_PAID_KEY)||"{}")}catch(e){return {}}
}
function getHeavensBookStableKey(book){
  return String(book?.supabaseId || book?.id || "").trim();
}
function isBookPaid(book){
  const paid=getPaidBooks();
  const key=getHeavensBookStableKey(book);
  if(key && paid[key]) return true;
  // Compatibility with older local records that were keyed by the local HB id.
  if(book?.id && paid[book.id]) return true;
  // Older versions could change the local/server id after publishing.
  // Preserve access by matching the saved payment record to the book title.
  const title=String(book?.title||'').trim().toLowerCase();
  if(title){
    for(const record of Object.values(paid)){
      if(record && String(record.title||'').trim().toLowerCase()===title) return true;
    }
  }
  return false;
}
function markBookPaid(book){
  const paid=getPaidBooks();
  const key=getHeavensBookStableKey(book);
  if(!key) return;
  paid[key]={paidAt:new Date().toISOString(),title:book.title};
  if(book.id && book.id!==key) paid[book.id]=paid[key];
  localStorage.setItem(HEAVENS_PAID_KEY,JSON.stringify(paid));
}

  const store=document.createElement("div"); store.id="heavensBookstore";
  let books=JSON.parse(localStorage.getItem("savedBooks")||"[]");
  const cats=["ALL","SERMONS","BIBLE","PRAYER","TEACHING","WORSHIP","PROPHECY","SPIRITUAL GROWTH"];
  store.innerHTML=`
    <div class="hb-head">
      <button class="hb-close" id="hbClose">×</button>
      <div class="hb-title">HEAVEN'S BOOKS</div>
      <div class="hb-sub">God's books • Read inside the app</div>
      <div class="hb-search"><input id="hbSearch" placeholder="Search God's books..." autocomplete="off"><button id="hbSearchBtn">⌕</button></div>
      <div class="hb-cats" id="hbCats"></div>
    </div>
    <div class="hb-grid" id="hbGrid"></div>`;
  document.body.appendChild(store);

  let activeCat="ALL";
  const grid=store.querySelector("#hbGrid");
  const search=store.querySelector("#hbSearch");
  const catsEl=store.querySelector("#hbCats");
  cats.forEach(cat=>{
    const b=document.createElement("button"); b.className="hb-cat"; b.innerText=cat;
    if(cat===activeCat)b.classList.add("active");
    b.onclick=()=>{activeCat=cat;catsEl.querySelectorAll(".hb-cat").forEach(x=>x.classList.remove("active"));b.classList.add("active");render();};
    catsEl.appendChild(b);
  });
  function render(){
    const q=search.value.trim().toLowerCase(); grid.innerHTML="";
    const filtered=books.filter(book=>{
      const cat=(book.category||"SERMONS").toUpperCase();
      return (activeCat==="ALL"||cat===activeCat) && (!q||String(book.title||"").toLowerCase().includes(q));
    });
    if(!filtered.length){grid.innerHTML=`<div class="hb-empty">No books found.<br><br>Try another search or category.</div>`;return;}
    filtered.forEach(book=>{
      const paid=isBookPaid(book); const card=document.createElement("div"); card.className="hb-card"; card.dataset.bookId=String(book.id);
      const cover=book.frontCover?`<img src="${book.frontCover}" alt="">`:`<div class="hb-cover-empty">${escapeBookHtml(book.title||"BOOK")}</div>`;
      const pending=(()=>{
        try{
          const p=JSON.parse(localStorage.getItem("heavensPendingPayment")||"null");
          return p && p.reference && (String(p.id)===String(book.id) || String(p.supabaseId||"")===String(book.supabaseId||book.id));
        }catch(e){ return false; }
      })();
      const displayPrice = Number(book.price || 0);
      const priceLabel = Number.isFinite(displayPrice) && displayPrice > 0 ? `TZS ${displayPrice.toLocaleString()}` : "PRICE NOT SET";
      card.innerHTML=`<div class="hb-cover">${cover}</div><div class="hb-card-body"><div class="hb-card-title">${escapeBookHtml(book.title||"Untitled Book")}</div><div class="hb-meta">${escapeBookHtml(book.category||"SERMONS")} • ${escapeBookHtml(book.date||"")}</div><div class="hb-price">${priceLabel}</div><div class="hb-actions"><button class="hb-btn ${paid?'read':'pay'}">${paid?'READ':'PAY'}</button><button class="hb-btn pay hb-check-payment" style="margin-left:6px">CHECK</button></div><div class="hb-lock">${paid?'Unlocked on this device':pending?'Payment sent — checking BLMPay…':'Payment required to read'}</div></div>`;
      const coverImg=card.querySelector('.hb-cover img');
      if(coverImg){
        coverImg.onerror=()=>{
          const holder=card.querySelector('.hb-cover');
          holder.innerHTML=`<div class="hb-cover-empty">${escapeBookHtml(book.title||'BOOK')}</div>`;
        };
      }
      card.querySelector(".hb-btn").onclick=()=> paid ? openBookReader(book,store) : startBookPayment(book,store);
      const checkBtn=card.querySelector('.hb-check-payment');
      if(checkBtn){
        checkBtn.onclick=async()=>{
          try{
            const p=JSON.parse(localStorage.getItem("heavensPendingPayment")||"null");
            checkBtn.disabled=true;
            checkBtn.textContent="CHECKING…";

            const localMatches = p && p.reference && (
              String(p.id)===String(book.id) ||
              String(p.supabaseId||"")===String(book.supabaseId||book.id)
            );

            if(localMatches){
              await watchHeavensPayment(book,store,p.reference);
              return;
            }

            // Important: payment references are normally stored server-side in book_orders.
            // This lets CHECK recover a payment even when localStorage was cleared,
            // the user changed browser/device, or the app was refreshed.
            const serverCheck = await checkHeavensPaymentStatus("", book.supabaseId || book.id);
            console.log("Heaven's Books server payment lookup:", serverCheck);

            const recoveredReference = getBlmPayReference(serverCheck) ||
              serverCheck?.reference || serverCheck?.blmpay_reference || "";

            if(serverCheck?.success && recoveredReference){
              localStorage.setItem("heavensPendingPayment",JSON.stringify({
                id:book.id,
                supabaseId:String(book.supabaseId || book.id),
                title:book.title,
                reference:String(recoveredReference),
                startedAt:Date.now(),
                recovered:true
              }));
              await watchHeavensPayment(book,store,String(recoveredReference));
              return;
            }

            if(paid){
              checkBtn.disabled=false;
              checkBtn.textContent="CHECK";
              alert("This book is already marked as PAID and unlocked on this device.");
            }else{
              checkBtn.disabled=false;
              checkBtn.textContent="CHECK";
              alert(serverCheck?.error || "No payment order was found for this book yet. If you already paid, make sure the payment was made for this exact book.");
            }
          }catch(e){
            console.warn(e);
            alert("Could not check this payment right now.");
          }
        };
      }
      grid.appendChild(card);
    });
  }
  search.oninput=render; store.querySelector("#hbSearchBtn").onclick=render;
  store.querySelector("#hbClose").onclick=()=>store.remove();
  render();

  // Refresh the storefront from the server, while keeping local editor books visible.
  const serverBooks = await loadHeavensServerBooks();
  if(serverBooks.length){
    const merged = new Map();
    books.forEach(b => merged.set(String(b.supabaseId || b.id), {...b}));
    serverBooks.forEach(b => {
      const key=String(b.supabaseId || b.id);
      const local=merged.get(key) || {};
      merged.set(key,{...local,...b,
        contents:b.contents || local.contents || "",
        frontCover:b.frontCover || local.frontCover || "",
        backCover:b.backCover || local.backCover || "",
        chapters:Array.isArray(b.chapters) && b.chapters.length ? b.chapters : (Array.isArray(local.chapters)?local.chapters:[])
      });
    });
    books = Array.from(merged.values());
    render();
  }
  resumeHeavensPendingPayment(store, books);
}

function escapeBookHtml(v){return String(v).replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}

let heavensPaymentPollTimer = null;

function getBlmPayReference(data){
  const candidates = [
    data?.reference,
    data?.payment_reference,
    data?.blmpay_reference,
    data?.payment?.reference,
    data?.payment?.payment_reference,
    data?.payment?.data?.reference,
    data?.payment?.data?.payment_reference,
    data?.payment?.data?.data?.reference,
    data?.blmpay?.reference,
    data?.blmpay?.payment_reference,
    data?.blmpay?.data?.reference,
    data?.blmpay?.data?.payment_reference,
    data?.blmpay?.data?.payment?.reference,
    data?.blmpay?.data?.payment?.payment_reference,
    data?.data?.reference,
    data?.data?.payment_reference,
    data?.data?.payment?.reference,
    data?.data?.payment?.payment_reference,
    data?.data?.payment?.data?.reference,
    data?.data?.payment?.data?.payment_reference,
    data?.data?.data?.reference
  ];
  const found=candidates.find(v=>v!==undefined && v!==null && String(v).trim());
  return found ? String(found).trim() : "";
}

function stopHeavensPaymentPolling(){
  if(heavensPaymentPollTimer){
    clearTimeout(heavensPaymentPollTimer);
    heavensPaymentPollTimer = null;
  }
}

async function checkHeavensPaymentStatus(reference, bookId){
  const body = {};
  if(reference) body.reference = String(reference);
  if(bookId) body.book_id = String(bookId);
  const {data,error} = await heavensSupabase.functions.invoke("heavens-blmpay-status",{
    body
  });
  if(error) throw error;
  return data || {};
}

async function watchHeavensPayment(book,store,reference){
  stopHeavensPaymentPolling();
  const started=Date.now();
  const timeout=5*60*1000;
  const ref=String(reference||"").trim();
  if(!ref){
    console.error("Heaven's Books: cannot watch payment without a BLMPay reference.");
    return;
  }

  const setCardState=(isPaid, message)=>{
    if(!store || !document.body.contains(store)) return;
    store.querySelectorAll('.hb-card').forEach(card=>{
      if(String(card.dataset.bookId)===String(book.id)){
        const btn=card.querySelector('.hb-btn');
        if(btn){
          btn.className="hb-btn "+(isPaid?"read":"pay");
          btn.textContent=isPaid?"READ":"PAY";
        }
        const lock=card.querySelector('.hb-lock');
        if(lock) lock.textContent=message || (isPaid?"Unlocked on this device":"Payment required to read");
      }
    });
  };

  const poll=async()=>{
    try{
      console.log("Heaven's Books: checking BLMPay reference",ref);
      const result=await checkHeavensPaymentStatus(ref);
      console.log("Heaven's Books BLMPay status response:",result);

      const status=String(
        result?.blmpay_status ||
        result?.status ||
        result?.payment?.status ||
        result?.payment?.data?.status ||
        result?.data?.blmpay_status ||
        result?.data?.status ||
        result?.data?.payment?.status ||
        result?.data?.payment?.data?.status ||
        result?.data?.data?.status ||
        ""
      ).trim().toLowerCase();

      console.log("Heaven's Books payment reference:",ref,"status:",status);

      if(["completed","success","succeeded","paid"].includes(status)){
        markBookPaid(book);
        localStorage.removeItem("heavensPendingPayment");
        stopHeavensPaymentPolling();
        setCardState(true,"Payment confirmed — book unlocked");
        alert("Payment confirmed by BLMPay. The book is now READ.");
        return;
      }

      if(["failed","voided","cancelled","expired","reversed"].includes(status)){
        localStorage.removeItem("heavensPendingPayment");
        stopHeavensPaymentPolling();
        setCardState(false,"Payment was not completed");
        alert("BLMPay payment was not completed. The book is still locked.");
        return;
      }

      if(store && document.body.contains(store)){
        store.querySelectorAll('.hb-card').forEach(card=>{
          if(String(card.dataset.bookId)===String(book.id)){
            const lock=card.querySelector('.hb-lock');
            if(lock) lock.textContent=status ? "Waiting for BLMPay confirmation…" : "Payment sent — checking BLMPay…";
          }
        });
      }
    }catch(err){
      console.warn("BLMPay status check failed:",err);
    }

    if(Date.now()-started >= timeout){
      stopHeavensPaymentPolling();
      if(store && document.body.contains(store)){
        store.querySelectorAll('.hb-card').forEach(card=>{
          if(String(card.dataset.bookId)===String(book.id)){
            const lock=card.querySelector('.hb-lock');
            if(lock) lock.textContent="Still waiting for BLMPay confirmation — tap PAY/CHECK again later.";
          }
        });
      }
      alert("We are still waiting for BLMPay confirmation. Your payment was not marked as paid locally yet. You can open Heaven's Books again later to check the same payment.");
      return;
    }
    heavensPaymentPollTimer=setTimeout(poll,3000);
  };
  poll();
}

async function resumeHeavensPendingPayment(store, books){
  try{
    const pending=JSON.parse(localStorage.getItem("heavensPendingPayment")||"null");
    if(!pending || !pending.reference) return;
    const list=Array.isArray(books) ? books : JSON.parse(localStorage.getItem("savedBooks")||"[]");
    const book=list.find(b=>
      String(b.id)===String(pending.id) ||
      String(b.supabaseId||"")===String(pending.supabaseId||"")
    );
    if(book) watchHeavensPayment(book,store,pending.reference);
  }catch(e){
    console.warn("Could not resume pending Heaven's Books payment:",e);
  }
}

async function startBookPayment(book,store){
  try{
    const session = await ensureHeavensAnonymousSession();
    if(!session || !session.access_token){
      throw new Error("Could not create a Supabase login session.");
    }

    const supabaseBookId = book.supabaseId || book.id;
    if(!supabaseBookId || !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(supabaseBookId))){
      alert("This book is not yet published to Heaven's Books server. Publish/sync the book first, then try PAY again.");
      return;
    }

    const amount = Number(book.price);
    if(!Number.isFinite(amount) || amount <= 0){
      alert("This book does not have a valid price yet. The author must set a price before it can be purchased.");
      return;
    }

    const phoneNumber = await heavensPhonePaymentDialog(book, amount);
    if(!phoneNumber) return;

    const {data,error} = await heavensSupabase.functions.invoke("heavens-blmpay-payment",{
      body:{
        book_id:String(supabaseBookId),
        phone_number:phoneNumber.trim(),
        firstname:"Heaven's Books",
        lastname:"Customer",
        email:(session.user && session.user.email) || "customer@heavens-books.local"
      }
    });

    if(error){
      console.error("Heaven's Books payment function error:",error);
      alert("Payment request could not be sent. Check the function response/logs.");
      return;
    }

    console.log("Heaven's Books BLMPay response:",data);

    if(data && data.success){
      const reference=getBlmPayReference(data);
      if(!reference){
        console.error("BLMPay payment response has no payment reference:",data);
        alert("BLMPay accepted the request, but no payment reference was returned. Do not pay again yet; check the payment function response.");
        return;
      }

      localStorage.setItem("heavensPendingPayment",JSON.stringify({
        id:book.id,
        supabaseId:String(supabaseBookId),
        title:book.title,
        reference,
        startedAt:Date.now(),
        blmpay:data.blmpay || data.payment || data
      }));

      render();
      alert("BLMPay payment request sent. Complete the mobile-money prompt. Payment reference: " + reference + "\n\nWe will automatically check BLMPay and unlock this book only after BLMPay reports it as completed.");
      watchHeavensPayment(book,store,reference);
    }else{
      const msg=data && (data.error || data.message) ? (data.error || data.message) : "BLMPay did not accept the payment request.";
      alert("Payment request failed: " + msg);
    }
  }catch(err){
    console.error("startBookPayment error:",err);
    alert("Could not start payment: " + (err && err.message ? err.message : err));
  }
}

function openBookReader(book,store){
  const existing=document.getElementById("heavensReader");
  if(existing) existing.remove();
  if(!isBookPaid(book)){startBookPayment(book,store);return;}

  const reader=document.createElement("div");
  reader.id="heavensReader";
  reader.innerHTML=`
    <div class="hr-head">
      <button class="hr-back" type="button" aria-label="Close book">×</button>
      <div class="hr-name">${escapeBookHtml(book.title||"Untitled Book")}</div>
      <div class="hr-counter" id="hrTopCount">1 / 1</div>
    </div>
    <div class="hr-stage" id="hrStage">
      <div class="hr-book" id="hrBook"></div>
      <div class="hr-hint">SWIPE OR USE ARROWS</div>
      <div class="hr-controls">
        <button class="hr-nav" id="hrPrev" type="button" aria-label="Previous page">‹</button>
        <div class="hr-page-count" id="hrPageCount">PAGE 1 / 1</div>
        <button class="hr-nav" id="hrNext" type="button" aria-label="Next page">›</button>
      </div>
    </div>`;
  document.body.appendChild(reader);

  const bookEl=reader.querySelector("#hrBook");
  const pageCountEl=reader.querySelector("#hrPageCount");
  const topCountEl=reader.querySelector("#hrTopCount");
  const pages=[];

  function addPage(kind,build){
    const page=document.createElement("article");
    page.className="hr-page"+(kind==="cover"?" hr-page-cover-wrap":"");
    page.style.display="none";
    const inner=document.createElement("div");
    inner.className="hr-page-inner";
    page.appendChild(inner);
    build(inner,page);
    const running=document.createElement("div");
    running.className="hr-running";
    running.innerHTML=`<span>${escapeBookHtml(book.title||"")}</span><span>${pages.length+1}</span>`;
    page.appendChild(running);
    bookEl.appendChild(page);
    pages.push(page);
  }

  const front=String(book.frontCover||"");
  if(front){
    addPage("cover",(inner,page)=>{
      const img=document.createElement("img");
      img.className="hr-page-cover";
      img.alt="Front cover";
      img.src=front;
      img.onerror=()=>{img.style.display="none";inner.textContent=book.title||"Untitled Book";inner.style.display="grid";inner.style.placeItems="center";inner.style.fontSize="32px";inner.style.fontWeight="800";};
      inner.appendChild(img);
      page.querySelector(".hr-running").style.display="none";
    });
  }else{
    addPage("title",inner=>{
      const sub=document.createElement("div"); sub.className="hr-page-subtitle"; sub.textContent="HEAVEN'S BOOKS";
      const title=document.createElement("h1"); title.className="hr-page-title"; title.textContent=book.title||"Untitled Book";
      inner.append(sub,title);
    });
  }

  if(String(book.contents||"").trim()){
    addPage("contents",inner=>{
      const title=document.createElement("h1"); title.className="hr-page-title"; title.textContent="Table of Contents";
      const text=document.createElement("div"); text.className="hr-page-text"; text.textContent=String(book.contents||"");
      inner.append(title,text);
    });
  }

  // Normalize older/local/server book formats so previously purchased books
  // remain readable even if their old record used content/text instead of chapters.
  let chapterList=Array.isArray(book.chapters)?book.chapters.filter(Boolean):[];
  let fallbackText=String(book.text||book.content||'').trim();
  if(!chapterList.length && !fallbackText){
    const localBooks=(()=>{try{return JSON.parse(localStorage.getItem('savedBooks')||'[]')}catch(e){return[]}})();
    const localMatch=localBooks.find(b=>
      (book.supabaseId && b.supabaseId && String(b.supabaseId)===String(book.supabaseId)) ||
      String(b.title||'').trim().toLowerCase()===String(book.title||'').trim().toLowerCase()
    );
    if(localMatch){
      if(Array.isArray(localMatch.chapters)) chapterList=localMatch.chapters.filter(Boolean);
      fallbackText=String(localMatch.text||localMatch.content||'').trim();
      if(!String(book.contents||'').trim()) book.contents=String(localMatch.contents||'');
      if(!String(book.frontCover||'').trim()) book.frontCover=String(localMatch.frontCover||'');
      if(!String(book.backCover||'').trim()) book.backCover=String(localMatch.backCover||'');
    }
  }
  if(!chapterList.length && fallbackText){
    chapterList=[{title:'Book Content',text:fallbackText}];
  }
  chapterList.forEach((ch,index)=>{
    const chapterTitle=String(ch?.title||("Chapter "+(index+1))).trim();
    addPage("chapter",inner=>{
      const title=document.createElement("h1"); title.className="hr-page-chapter"; title.textContent=chapterTitle;
      inner.appendChild(title);
    });

    const raw=String(ch?.text||"").trim();
    const paragraphs=raw.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
    const chunks=[];
    let current="";
    // Conservative chunks prevent text from disappearing below the page edge.
    const target=window.innerWidth<600?900:1550;
    paragraphs.forEach(par=>{
      if(par.length>target){
        if(current){chunks.push(current);current="";}
        for(let i=0;i<par.length;i+=target) chunks.push(par.slice(i,i+target));
      }else{
        const candidate=current?(current+"\n\n"+par):par;
        if(candidate.length>target && current){chunks.push(current);current=par;}else current=candidate;
      }
    });
    if(current)chunks.push(current);
    if(!chunks.length)chunks.push("");

    chunks.forEach(chunk=>addPage("text",inner=>{
      const text=document.createElement("div"); text.className="hr-page-text"; text.textContent=chunk;
      inner.appendChild(text);
    }));
  });

  const back=String(book.backCover||"");
  if(back){
    addPage("cover",(inner,page)=>{
      const img=document.createElement("img");
      img.className="hr-page-cover";
      img.alt="Back cover";
      img.src=back;
      img.onerror=()=>{img.style.display="none";inner.textContent="THE END";inner.style.display="grid";inner.style.placeItems="center";inner.style.fontSize="30px";inner.style.fontWeight="800";};
      inner.appendChild(img);
      page.querySelector(".hr-running").style.display="none";
    });
  }

  if(!pages.length){
    addPage("title",inner=>{
      const title=document.createElement("h1"); title.className="hr-page-title"; title.textContent=book.title||"Untitled Book";
      inner.appendChild(title);
    });
  }

  let currentPage=0;
  let turning=false;
  function updateReader(){
    pages.forEach((p,i)=>{
      p.style.display=(i===currentPage)?"block":"none";
      p.style.zIndex=(i===currentPage)?10:1;
      p.classList.remove("is-turning-next","is-turning-prev");
    });
    const label=`${currentPage+1} / ${pages.length}`;
    pageCountEl.textContent=`PAGE ${label}`;
    topCountEl.textContent=label;
  }
  function turnTo(nextPage,direction){
    if(turning||nextPage<0||nextPage>=pages.length||nextPage===currentPage)return;
    turning=true;
    const old=pages[currentPage], next=pages[nextPage];
    next.style.display="block";
    next.style.zIndex="9";
    old.style.zIndex="10";
    old.classList.add(direction>0?"is-turning-next":"is-turning-prev");
    setTimeout(()=>{
      currentPage=nextPage;
      turning=false;
      updateReader();
    },470);
  }
  const next=()=>turnTo(currentPage+1,1);
  const prev=()=>turnTo(currentPage-1,-1);

  reader.querySelector("#hrNext").onclick=e=>{e.stopPropagation();next();};
  reader.querySelector("#hrPrev").onclick=e=>{e.stopPropagation();prev();};
  const closeReader=()=>{reader.remove();document.body.style.overflow="";};
  reader.querySelector(".hr-back").onclick=e=>{e.stopPropagation();closeReader();};
  reader.tabIndex=0;
  reader.focus();
  reader.addEventListener("keydown",e=>{
    if(e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();next();}
    if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();prev();}
    if(e.key==="Escape"){e.preventDefault();closeReader();}
    if((e.ctrlKey||e.metaKey)&&["c","p","s","u"].includes(e.key.toLowerCase()))e.preventDefault();
  });

  let startX=0,startY=0;
  reader.addEventListener("touchstart",e=>{const t=e.changedTouches[0];startX=t.screenX;startY=t.screenY;},{passive:true});
  reader.addEventListener("touchend",e=>{const t=e.changedTouches[0];const dx=t.screenX-startX,dy=t.screenY-startY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2){dx<0?next():prev();}},{passive:true});
  reader.addEventListener("contextmenu",e=>e.preventDefault());
  reader.addEventListener("copy",e=>e.preventDefault());
  reader.addEventListener("cut",e=>e.preventDefault());
  reader.addEventListener("dragstart",e=>e.preventDefault());
  updateReader();
}

// Optional gateway return hook: if the gateway is configured to redirect back with
// ?payment=success&book=<id>, unlock the matching book persistently.
(function handlePaymentReturn(){
  const p=new URLSearchParams(location.search); const id=p.get("book");
  if(id && p.get("payment")==="success"){
    const books=JSON.parse(localStorage.getItem("savedBooks")||"[]"); const book=books.find(b=>b.id===id);
    if(book) markBookPaid(book);
  }
})();

/* ================= SAVED SERMONS SAFETY BINDINGS ================= */
// Re-bind these two controls at the end of the script as a safety net.
// This keeps them clickable even if another UI layer changes its stacking order.
(function hardenSavedSermonControls(){
  const saveBtn=document.getElementById('saveTranscript');
  const savedBtn=document.getElementById('savedSermons');
  if(saveBtn){ saveBtn.style.position='relative'; saveBtn.style.zIndex='100'; saveBtn.style.pointerEvents='auto'; }
  if(savedBtn){ savedBtn.style.position='relative'; savedBtn.style.zIndex='100'; savedBtn.style.pointerEvents='auto'; }
})();

/* ================= GLOBAL GESTURES ================= */
let startY=0,endY=0;

document.addEventListener("touchstart",(e)=>{
  startY=e.changedTouches[0].screenY;
});

document.addEventListener("touchend",(e)=>{
  endY=e.changedTouches[0].screenY;
  let dy=endY-startY;

  if(dy<-60){
    smartToggle.style.opacity="1";
    smartToggle.style.transform="translateY(0)";
  }

  if(dy>60){
    smartPanel.classList.remove("show");
    smartToggle.classList.remove("active");
    smartToggle.style.opacity="0";
    smartToggle.style.transform="translateY(100px)";
    controls.classList.remove("show");
  }
});
